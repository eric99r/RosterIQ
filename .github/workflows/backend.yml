name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend in Linux
        run: docker compose -p rosteriq-checks -f compose.test.yaml run --build --rm checks
      - name: Clean up
        if: always()
        run: docker compose -p rosteriq-checks -f compose.test.yaml down --volumes
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check React, TypeScript, and production build in Linux
        run: docker compose -p rosteriq-checks -f compose.test.yaml run --build --rm frontend-checks
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check full stack in Chromium
        run: docker compose -p rosteriq-e2e -f compose.yaml -f compose.e2e.yaml run --build --rm browser
      - name: Clean up
        if: always()
        run: docker compose -p rosteriq-e2e -f compose.yaml -f compose.e2e.yaml down --volumes
