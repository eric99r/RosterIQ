services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rosteriq
      POSTGRES_PASSWORD: rosteriq
      POSTGRES_DB: rosteriq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosteriq -d rosteriq"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://rosteriq:rosteriq@db:5432/rosteriq
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://rosteriq:rosteriq@db:5432/rosteriq
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
volumes:
  postgres_data:
