services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
  frontend:
    image: rosteriq-frontend-dev
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://api:8000
      # Polling supports Docker Desktop mounts as well as native Linux.
      CHOKIDAR_USEPOLLING: "true"
    ports: !override
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
